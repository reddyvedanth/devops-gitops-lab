apiVersion: v1
kind: Service
metadata:
  name: notes-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: notes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: notes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notes
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
