# Production overlay. Same Helm chart as the lab, different environment settings.
#
#   -1  namespace
#    0  database Secret
#    1  database Service and Deployment
#    2  web Service, Deployment, and PodDisruptionBudget

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml

helmGlobals:
  chartHome: ../../charts

helmCharts:
  - name: notes
    releaseName: notes
    namespace: production
    valuesInline:
      web:
        db:
          host: notes-db.production.svc.cluster.local
        service:
          type: NodePort
          nodePort: 30081

images:
  - name: notes-web
    newName: docker.io/vedanthreddy/notes-web
    newTag: "b798d5cd85df3edfb45a0a40314f5212c8fdfe3f"

replicas:
  - name: notes-web
    count: 4

secretGenerator:
  - name: notes-db-auth
    literals:
      - POSTGRES_USER=notes
      - POSTGRES_PASSWORD=notes-prod-pass
      - POSTGRES_DB=notes
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "0"

patches:
  - target:
      version: v1
      kind: Namespace
      name: production
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: production
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      version: v1
      kind: Service
      name: notes-db
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: notes-db
        annotations:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: notes-db
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notes-db
        annotations:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      version: v1
      kind: Service
      name: notes-web
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: notes-web
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: notes-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notes-web
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: notes-web
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: notes-web
        annotations:
          argocd.argoproj.io/sync-wave: "2"
