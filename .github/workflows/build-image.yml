name: build-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notes-web:${{ github.sha }}

      - name: Print the tag to commit
        run: |
          echo "Image pushed."
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/notes-web:${{ github.sha }}"
          echo
          echo "This workflow does not edit git."
          echo "Set deploy/overlays/lab/kustomization.yaml images.newTag to:"
          echo "${{ github.sha }}"
          echo "Commit and push that file. Argo CD will roll the web pods."
